name: Bayern-Wetterkompass alle 6 Stunden

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: bayern-wetterkompass
  cancel-in-progress: false

jobs:
  wetterkompass:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          ref: public-beta-stable

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Bibliotheken installieren
        run: python -m pip install pandas pillow requests numpy

      - name: Wetterkompass aktualisieren
        env:
          TZ: Europe/Berlin
        run: python scripts/wetterkompass/aktualisieren.py

      - name: Wettergrafiken speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- static/wetterkompass/bayern_14_tage_tabelle_*.png
          if git diff --cached --quiet; then
            echo "Keine neuen Wettergrafiken vorhanden."
          else
            git commit -m "Bayern-Wetterkompass automatisch aktualisiert"
            git push origin HEAD:public-beta-stable
          fi
