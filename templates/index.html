<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/leaflet/leaflet.css">
    <title>Wetterstudio AI Neu</title>

    <style>
        body{
            margin:0;
            background:#0f172a;
            color:white;
            font-family:Arial,Helvetica,sans-serif;
        }

        h1{
            text-align:center;
            margin-top:30px;
        }

        #karte{
            width:95%;
            height:700px;
            margin:30px auto;
            border:3px solid #3b82f6;
            border-radius:12px;
            background:#1e293b;
        }
</style>

</head>

<body>

<h1>🌩 Wetterstudio AI – Neue DWD-Warnkarte</h1>

<div id="karte">
    Deutschlandkarte wird hier aufgebaut…
</div>
<script>
</script>
    <script src="/static/leaflet/leaflet.js"></script>
<script src="/static/js/warnkarte.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const lagekarteElement = document.getElementById("hnd-lagekarte");

    if (!lagekarteElement) {
        console.error("HND-Lagekarte: Container nicht gefunden.");
        return;
    }

    const lagekarte = L.map("hnd-lagekarte", {
        zoomControl: true
    }).setView([47.7830, 12.0060], 15);

    const dop20 = L.tileLayer.wms(
        "https://geoservices.bayern.de/od/wms/dop/v1/dop20?",
        {
            layers: "by_dop20c",
            styles: "",
            format: "image/png",
            transparent: false,
            version: "1.1.1",
            attribution: "Bayerische Vermessungsverwaltung"
        }
    ).addTo(lagekarte);

    const markerIcon = L.icon({
        iconUrl: "https://www.hnd.bayern.de/images/symbole/Map_Pin_with_Shadow.png",
        iconSize: [44, 50],
        iconAnchor: [0, 50],
        popupAnchor: [22, -45]
    });

    const messstellenMarker = L.marker(
        [47.7830, 12.0060],
        { icon: markerIcon }
    ).addTo(lagekarte);

    messstellenMarker.bindPopup(
        "<strong>Bad Feilnbach / Jenbach</strong><br>" +
        "Messstellennummer: 18284504<br>" +
        "Gewässer: Jenbach"
    );

    lagekarteElement.addEventListener("click", function () {

        const modal = document.getElementById("hnd-lagekarte-modal");
        const gross = document.getElementById("hnd-lagekarte-gross");

        if (!modal || !gross) {
            return;
        }

        modal.style.display = "block";

        if (!gross.dataset.initialized) {

            const grosseKarte = L.map("hnd-lagekarte-gross", {
                zoomControl: true
            }).setView([47.7830, 12.0060], 15);

            L.tileLayer.wms(
                "https://geoservices.bayern.de/od/wms/dop/v1/dop20?",
                {
                    layers: "by_dop20c",
                    styles: "",
                    format: "image/png",
                    transparent: false,
                    version: "1.1.1",
                    attribution: "Bayerische Vermessungsverwaltung"
                }
            ).addTo(grosseKarte);

            L.marker(
                [47.7830, 12.0060],
                { icon: markerIcon }
            ).addTo(grosseKarte)
            .bindPopup(
                "<strong>Bad Feilnbach / Jenbach</strong><br>" +
                "Messstellennummer: 18284504<br>" +
                "Gewässer: Jenbach"
            );

            gross.dataset.initialized = "true";
            window.hndGrosseLagekarte = grosseKarte;

            setTimeout(function () {
                grosseKarte.invalidateSize();
            }, 100);
        }
        else if (window.hndGrosseLagekarte) {
            setTimeout(function () {
                window.hndGrosseLagekarte.invalidateSize();
            }, 100);
        }
    });

    const schliessen = document.getElementById("hnd-lagekarte-schliessen");

    if (schliessen) {
        schliessen.addEventListener("click", function (event) {
            event.stopPropagation();

            const modal = document.getElementById("hnd-lagekarte-modal");

            if (modal) {
                modal.style.display = "none";
            }
        });
    }

});
</script>
</body>
</html>
